version: "3.8"

services:
  superset:
    build: .
    container_name: superset
    ports:
      - "8088:8088"
    environment:
      SUPERSET_SECRET_KEY: "secret_key"
    command: >
      bash -c "
      superset db upgrade &&
      superset fab create-admin
        --username admin
        --firstname Admin
        --lastname User
        --email admin@superset.com
        --password admin || true &&
      superset init &&
      superset run -h 0.0.0.0 -p 8088
      "

  trino:
    image: trinodb/trino:latest
    container_name: trino
    ports:
      - "8082:8080"
